<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双栈商店 - 系统设置</title>
    <link rel="icon" href="/src/images/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/components/sidebar/sidebar.css">
    <link rel="stylesheet" href="/src/components/common/buttons.css">
    <link rel="stylesheet" href="settings.css">
    <style>
        .quick-links-section { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
        .quick-link-card {
            display:flex; align-items:center; gap:12px; padding:14px 16px;
            background:#fff; border-radius:12px; text-decoration:none; color:inherit;
            box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer; border:none; width:100%;
            font-size:15px;
        }
        .quick-link-card i:first-child { font-size:20px; color:var(--primary,#667eea); width:28px; text-align:center; }
        .quick-link-card span { flex:1; text-align:left; font-weight:500; }
        .quick-link-card i:last-child { color:#bbb; transition:transform .2s; }
        .quick-link-card.open i:last-child { transform:rotate(90deg); }
        .embed-panel {
            display:none; background:#fff; border-radius:12px; overflow:hidden;
            box-shadow:0 1px 3px rgba(0,0,0,.06); height:60vh;
        }
        .embed-panel.show { display:block; }
        .embed-panel iframe { width:100%; height:100%; border:none; }
    </style>
</head>
<body>
    <div class="dashboard-container" id="appContainer">
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>系统设置</h1>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <div class="user-avatar">
                            <img src="/src/images/logo.png" alt="用户头像">
                        </div>
                        <span class="username" id="currentUsername">加载中...</span>
                    </div>
                </div>
            </header>
            
            <div class="content-area">
            <section class="mirror-section">
                <div class="section-header">
                    <h2>Docker 加速源</h2>
                    <button id="saveMirrorBtn" class="save-btn" onclick="saveDockerMirrors()">
                        <i class="fas fa-save"></i>
                        <span>保存并重启 Docker</span>
                    </button>
                </div>
                
                <div class="mirror-card">
                    <div class="mirror-info">
                        <div class="mirror-list" id="mirrorList" class="drag-list" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
                            <div class="mirror-empty">加载中...</div>
                        </div>
                        <div class="mirror-add-form">
                            <input type="text" id="newMirror" placeholder="https://mirror.example.com">
                            <button class="add-mirror-btn" onclick="addMirror()">
                                <i class="fas fa-plus"></i>
                                添加
                            </button>
                        </div>
                        <div class="mirror-tips">
                            <i class="fas fa-info-circle"></i>
                            常用加速源：
                            <a href="javascript:void(0)" onclick="addPresetMirror('https://mirror.ccs.tencentyun.com')">腾讯云</a> |
                            <a href="javascript:void(0)" onclick="addPresetMirror('https://hub-mirror.c.163.com')">网易</a> |
                            <a href="javascript:void(0)" onclick="addPresetMirror('https://docker.mirrors.ustc.edu.cn')">中科大</a> |
                            <a href="javascript:void(0)" onclick="addPresetMirror('https://registry.docker-cn.com')">Docker CN</a>
                        </div>
                    </div>
                </div>
            </section>

            <div class="quick-links-section">
                <button class="quick-link-card" onclick="togglePanel('logsPanel', this)">
                    <i class="fas fa-clipboard-list"></i>
                    <span>操作日志</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="embed-panel" id="logsPanel">
                    <iframe src="/src/pages/logs/logs.html?embed=1"></iframe>
                </div>
                <button class="quick-link-card" onclick="togglePanel('usersPanel', this)">
                    <i class="fas fa-user-cog"></i>
                    <span>用户管理</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="embed-panel" id="usersPanel">
                    <iframe src="/src/pages/users/users.html?embed=1"></iframe>
                </div>
            </div>
            
            </div>
        </main>
        <div id="messageToast" class="message-toast"></div>
    </div>
    
    <script src="/src/components/common/page-common.js"></script>
    <script src="/src/components/common/cache.js"></script>
    <script src="settings.js"></script>
    <script>
    function togglePanel(id, btn) {
        var p = document.getElementById(id);
        var open = p.classList.toggle('show');
        btn.classList.toggle('open', open);
        // 同时只展开一个
        document.querySelectorAll('.embed-panel').forEach(function(el){
            if(el.id !== id) el.classList.remove('show');
        });
        document.querySelectorAll('.quick-link-card').forEach(function(el){
            if(el !== btn) el.classList.remove('open');
        });
    }
    </script>
</body>
</html>
