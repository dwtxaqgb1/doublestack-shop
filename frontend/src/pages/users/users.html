<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>账户管理</title>
    <link rel="icon" href="/src/images/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/components/sidebar/sidebar.css">
    <link rel="stylesheet" href="/src/components/common/buttons.css">
    <link rel="stylesheet" href="users.css">
    <style>
        .account-card { background:#fff; border-radius:12px; padding:20px; margin:8px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .account-card h2 { font-size:16px; margin-bottom:16px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:13px; color:#666; margin-bottom:4px; }
        .form-group input { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px; box-sizing:border-box; }
        .save-btn { width:100%; padding:12px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
        .save-btn:disabled { opacity:.6; }
    </style>
</head>
<body>
    <div class="users-layout" id="appContainer">
        <main class="main-content">
            <header class="top-header">
                <div class="header-left"><h1>账户管理</h1></div>
            </header>

            <div class="content-area">
                <div class="account-card">
                    <h2>管理员账户</h2>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="adminUsername" value="" placeholder="输入新用户名">
                    </div>
                    <div class="form-group">
                        <label>新密码（不修改请留空）</label>
                        <input type="password" id="adminPassword" placeholder="输入新密码">
                    </div>
                    <button class="save-btn" id="saveBtn" onclick="saveAccount()">保存修改</button>
                </div>
            </div>
        </main>
        <div id="messageToast" class="message-toast" role="status" aria-live="polite"></div>
    </div>
    <script src="/src/components/common/page-common.js"></script>
    <script>
    const { API_BASE_URL, apiFetch } = window.AppPage;
    let originalUsername = '';

    async function init() {
        const user = await window.AppPage.syncCurrentUser();
        if (user) {
            originalUsername = user.username;
            document.getElementById('adminUsername').value = user.username;
        }
    }

    function showMessage(text, type) {
        const t = document.getElementById('messageToast');
        t.textContent = text;
        t.style.background = type === 'success' ? '#22c55e' : '#ef4444';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function saveAccount() {
        const btn = document.getElementById('saveBtn');
        const username = document.getElementById('adminUsername').value.trim();
        const password = document.getElementById('adminPassword').value;
        if (!username) { showMessage('用户名不能为空', 'error'); return; }
        btn.disabled = true;
        btn.textContent = '保存中...';
        try {
            const body = { username };
            if (password) body.password = password;
            const res = await apiFetch(`${API_BASE_URL}/users/${encodeURIComponent(originalUsername)}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || e.message || '保存失败'); }
            originalUsername = username;
            document.getElementById('adminPassword').value = '';
            await window.AppPage.syncCurrentUser();
            showMessage('保存成功', 'success');
        } catch(e) {
            showMessage(e.message || '网络错误', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = '保存修改';
        }
    }

    init();
    </script>
</body>
</html>
